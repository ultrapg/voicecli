[package]
name = "voicecli"
version = "0.3.0"
edition = "2021"
authors = ["Antigravity"]
description = "Ultra-Fast, Native Single-Binary Qwen3-TTS CLI (Rust + C/C++ GGML Engine)"
license = "GPL-3.0"
repository = "https://github.com/ultrapg/voicecli"

[dependencies]
clap = { version = "4.5", features = ["derive"] }

[build-dependencies]
cc = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
